name: Build and Upload All Build Output (Docker) # Updated workflow name

on:
  push:
  pull_request:
  workflow_dispatch: # Allows manual triggering

jobs:
  build:
    # Use the standard 'ubuntu-latest' runner as the host
    runs-on: ubuntu-latest

    steps:
    # Step 1: Checkout the repository onto the host runner
    - name: Checkout Code
      uses: actions/checkout@v4

    # Step 2: Build inside a Docker container using Ubuntu 20.04 as base
    - name: Build inside Docker (Ubuntu 20.04 base)
      run: |
        echo "--- Pulling Docker Image ubuntu:20.04 ---"
        docker pull ubuntu:20.04

        echo "--- Running Build Script inside Docker Container ---"
        docker run --rm \
          -v "${{ github.workspace }}":/work \
          -w /work \
          ubuntu:20.04 \
          /bin/bash -c " \
            echo '+++ [Docker] Updating apt and installing dependencies +++' && \
            apt-get update > /dev/null && \
            apt-get install -y --no-install-recommends software-properties-common > /dev/null && \
            add-apt-repository universe > /dev/null && \
            apt-get update > /dev/null && \
            apt-get install -y --no-install-recommends make gcc-arm-none-eabi python2 > /dev/null && \
            echo '+++ [Docker] Verifying Python Version +++' && \
            python2 --version && \
            echo '+++ [Docker] Building Bootloader (make boot) +++' && \
            make boot && \
            echo '+++ [Docker] Building Application (make all) +++' && \
            make all && \
            echo '+++ [Docker] Build Complete +++' \
          "

    # Step 3: List generated files (Optional Debugging on Host)
    - name: List generated files in workspace
      run: |
        echo "--- Contents of obj_boot on host: ---"
        ls -lR obj_boot || echo "obj_boot not found or empty"
        echo "--- Contents of obj_app on host: ---"
        ls -lR obj_app || echo "obj_app not found or empty"


    # Step 4: Upload Entire Build Output Directories as Artifacts
    - name: Upload Build Output Directories # Updated step name
      uses: actions/upload-artifact@v4
      with:
        # Updated artifact name to reflect it contains full directories
        name: nucular-kb-build-output
        # Paths to the directories to upload. The action will archive their contents.
        path: |
          obj_boot
          obj_app
        # Fail the workflow if the directories themselves are missing
        if-no-files-found: error
