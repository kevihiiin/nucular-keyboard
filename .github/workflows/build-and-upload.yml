name: Build and Upload Binaries

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # CHANGE HERE: Use an older Ubuntu version
    runs-on: ubuntu-20.04

    steps:
    # Step 1: Checkout the repository
    - name: Checkout Code
      uses: actions/checkout@v4

    # Step 2: Install dependencies including Python 2 via apt
    - name: Install Dependencies
      run: |
        sudo apt-get update
        # Needed for add-apt-repository
        sudo apt-get install -y software-properties-common
        # Ensure the 'universe' repository is enabled (often is by default on 20.04, but explicit is safer)
        sudo add-apt-repository universe
        sudo apt-get update
        # Install make, gcc, and python2 from apt
        sudo apt-get install -y make gcc-arm-none-eabi python2
        # Optional: Create a 'python' symlink if your Makefiles call 'python' instead of 'python2'
        # sudo ln -sf /usr/bin/python2 /usr/bin/python

    # Step 3: Verify Python version (Optional)
    - name: Verify Python Installation
      run: |
        python2 --version # Check python2 explicitly
        # If you created the symlink above, you can also check 'python --version'

    # Step 4: Build USB DFU bootloader
    - name: Build USB DFU Bootloader
      run: |
        make boot

    # Step 5: Build Keyboard Application
    - name: Build Keyboard Application
      run: |
        make all

    # Step 6: Upload Binaries
    - name: Upload Binaries
      uses: actions/upload-artifact@v4
      with:
        name: binaries-ubuntu-20.04 # Optional: Add runner OS to artifact name
        path: |
          obj_boot/f00b00t.hex
          obj_app/nucular_kb.hex
          obj_app/nucular_kb.dfu
