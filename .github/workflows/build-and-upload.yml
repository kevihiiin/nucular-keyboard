name: Build and Upload Binaries

on:
  push:
  pull_request:
  workflow_dispatch: # Allows manual triggering

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Checkout the repository
    - name: Checkout Code
      uses: actions/checkout@v4

    # Step 2: Install system dependencies (excluding Python 2)
    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y make gcc-arm-none-eabi software-properties-common

    # Step 3: Setup Python 2 using the dedicated action
    - name: Set up Python 2.7
      uses: actions/setup-python@v5 # Use the latest major version
      with:
        python-version: '2.7' # Specify Python 2.7

    # Step 4: Verify Python version (Optional but recommended)
    - name: Verify Python Installation
      run: |
        python --version # Should output Python 2.7.x
        which python # Should point to the toolcache directory used by setup-python

    # Step 5: Build USB DFU bootloader
    - name: Build USB DFU Bootloader
      run: |
        make boot

    # Step 6: Build Keyboard Application
    - name: Build Keyboard Application
      run: |
        make all

    # Step 7: Upload Binaries
    - name: Upload Binaries
      uses: actions/upload-artifact@v4 # Use the latest major version
      with:
        name: binaries
        path: |
          obj_boot/f00b00t.hex
          obj_app/nucular_kb.hex
          obj_app/nucular_kb.dfu
