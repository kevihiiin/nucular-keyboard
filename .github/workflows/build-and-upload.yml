name: Build and Upload Binaries

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest # The host runner can be latest

    steps:
    # Step 1: Checkout the repository
    - name: Checkout Code
      uses: actions/checkout@v4

    # Step 2: Build using Docker
    - name: Build inside Docker container with Python 2
      run: |
        # Use an image known to have python2, e.g., ubuntu:20.04, debian:buster
        # Pull the image first
        docker pull ubuntu:20.04

        # Run the build commands inside the container
        # -v $(pwd):/work mounts the current directory (your repo) into /work inside the container
        # -w /work sets the working directory inside the container
        docker run --rm \
          -v $(pwd):/work \
          -w /work \
          ubuntu:20.04 \
          /bin/bash -c " \
            apt-get update && \
            apt-get install -y software-properties-common && \
            add-apt-repository universe && \
            apt-get update && \
            apt-get install -y python2 make gcc-arm-none-eabi && \
            echo '--- Verifying Python ---' && \
            python2 --version && \
            echo '--- Building Bootloader ---' && \
            make boot && \
            echo '--- Building Application ---' && \
            make all && \
            echo '--- Build Complete ---' \
          "

    # Step 3: Upload Binaries (Binaries are in the workspace checked out in Step 1)
    - name: Upload Binaries
      uses: actions/upload-artifact@v4
      with:
        name: binaries
        path: |
          obj_boot/f00b00t.hex
          obj_app/nucular_kb.hex
          obj_app/nucular_kb.dfu
